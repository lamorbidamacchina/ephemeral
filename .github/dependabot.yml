version: 2
updates:
  - package-ecosystem: npm
    directory: /next-app
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /ws-server
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /next-app
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /ws-server
    schedule:
      interval: weekly
